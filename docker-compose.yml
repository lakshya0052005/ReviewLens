services:
  reviewlens:
    build: .
    container_name: reviewlens_app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-1.5-flash}
      - PROMPT_VERSION=${PROMPT_VERSION:-v1}
      - BATCH_SIZE=5
      - MAX_CONCURRENT_CALLS=2
      - PORT=8000
      - DB_PATH=/data/reviewlens.db
    volumes:
      # Mount SQLite storage directory so database persists across container rebuilds
      - reviewlens_data:/data
    restart: unless-stopped

volumes:
  reviewlens_data:
